name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci || npm install

      - name: 🔨 Compilar aplicação Web (React + Vite)
        run: npm run build

      - name: 🔄 Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: 🔑 Dar permissão de execução ao Gradle
        run: chmod +x android/gradlew

      - name: 🤖 Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Fazer upload do APK para download
        uses: actions/upload-artifact@v4
        with:
          name: app-geolocalizacao-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
